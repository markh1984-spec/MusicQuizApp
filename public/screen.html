<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Screen</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="screen">
  <div class="stage">
    <header class="topbar">
      <div class="titles">
        <span id="brandSlot"></span>
        <span class="title" id="quizTitle">Music Quiz</span>
      </div>
      <div class="right">
        <span class="pill" id="roundPill">Waiting</span>
        <span class="pill" id="playerPill">0 playing</span>
      </div>
    </header>
    <main id="card" class="card"><!-- cards are swapped in here --></main>
  </div>
  <div id="connWarn" class="conn-warn hidden">Reconnecting…</div>
  <script type="module" src="/assets/screen.js"></script>
</body>
</html>
