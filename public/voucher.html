  WHERE A SCANNED VOUCHER LANDS, and it is written for BAR STAFF.

  The person holding this phone has never heard of Quizporium, is standing
  behind a bar, and wants to know one thing: do I give this person a drink.
  So the reward is the biggest thing on the page, the instruction is a
  sentence, and the branding is a line at the bottom.

  No login. The code in the address is the whole credential, which is why it
  is eight characters of the join-code alphabet and why a wrong one finds
  nothing rather than a near miss.
-->
