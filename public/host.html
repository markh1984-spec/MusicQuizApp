<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a13">
  <title>Control</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="host">
  <div class="wrap">
    <div class="bar">
      <!-- The way back, SAID OUT LOUD. The logo has always linked to the
           console, with the reason in a `title` — which is a tooltip, and
           there are no tooltips on a phone. So on the one device this page is
           actually used on, the way back was invisible and the answer was to
           type the URL. Same fault as "Control view" being a small grey link
           between two others: the control existed and the label did not. -->
      <div class="bar-top">
        <span id="brandSlot"></span>
        <nav id="navSlot" class="topnav"></nav>
        <span class="spacer"></span>
        <span id="hatSlot"></span>
        <span id="outSlot"></span>
      </div>
      <div>
        <div class="where" id="where">Control</div>
        <!-- WHAT THE ROOM IS LOOKING AT. A performer's prompt rather than a
             status readout — a quizmaster behind a mic cannot see sixty
             phones, and what is on them decides what they say next. Labelled,
             because the line above is about the GAME and this one is about the
             PHONES, and two bare one-line statuses an inch apart is the label
             collision this project keeps recording. -->
        <div class="tiny phones-are" id="phonesAre" hidden></div>
        <div class="tiny" id="connText">Connecting…</div>
      </div>
      <div class="clock" id="clock">--</div>
    </div>
    <main id="main"></main>
  </div>
  <div class="actions" id="actions"></div>
  <script type="module" src="/assets/host.js"></script>
</body>
</html>
