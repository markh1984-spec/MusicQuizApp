<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a13">
  <title>Sign in — Quizporium</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="console">
  <div class="wrap">
    <div class="sign-in">
      <div class="sign-in-brand" id="brandSlot"></div>
      <h1 class="grad-text">Sign in</h1>
      <form id="signIn" autocomplete="on">
        <label>Email
          <input type="email" name="email" autocomplete="username" required
                 autocapitalize="none" spellcheck="false" enterkeyhint="next">
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required
                 enterkeyhint="go">
        </label>
        <button class="go" type="submit">Sign in</button>
        <div class="sign-in-problem" id="problem" role="alert"></div>
      </form>
      <p class="tiny">
        <button type="button" class="linky" id="forgot">Forgotten your password?</button>
      </p>
      <!-- Its own form rather than a second page. Somebody who has just been
           told their password is wrong is already here, already has the
           address typed, and a page change would lose it. -->
      <!--
        ONE WAY IN IS OFFERED FIRST, AND IT IS THE ONE THAT CHANGES NOTHING.

        Somebody pressing "forgotten your password" wants to be IN, not to
        choose a new password and type it twice — so the sign-in link leads and
        the reset is the quieter second answer underneath it. Both were built
        together after exactly this: a password used once a week is a password
        you forget.
      -->
      <form id="forgotForm" class="forgot" hidden>
        <label>Where shall the link go?
          <input type="email" name="email" autocomplete="username"
                 autocapitalize="none" spellcheck="false" enterkeyhint="go" required>
        </label>
        <!--
          ORDINARY, NOT THE GRADIENT. "Sign in" is still on the screen and the
          rule is one filled gradient per screen — the moment there are two,
          neither is the thing to press. This is the loudest control INSIDE its
          own little form, which is as loud as it needs to be.
        -->
        <button class="minor" type="submit" id="wantMagic">Email me a sign-in link</button>
        <button type="button" class="linky" id="wantReset">Set a new password instead</button>
        <div class="sign-in-problem" id="forgotSaid" role="status"></div>
      </form>
    </div>
  </div>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
